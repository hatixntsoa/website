<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hatix Ntsoa</title>
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
    <link rel="shortcut icon" href="assets/favicon.ico" />
    <script src="scripts/theme-init.js"></script>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="project-topbar">
        <div class="topbar-inner">
          <nav id="topbar-links" class="project-topbar-links" aria-label="Projects"></nav>
          <div class="topbar-actions">
            <div class="theme-chooser" role="group" aria-label="Color theme">
              <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
              <button type="button" data-theme-choice="dark" aria-pressed="true">Dark</button>
            </div>
          </div>
        </div>
      </header>

      <main class="site-content">
        <div class="dashed-box profile-panel">
          <p id="profile-greeting" class="profile-greeting"></p>
          <h1 class="profile-title">
            <span id="electric-name" class="electric-name"></span>
            <b class="name-cursor" aria-hidden="true">█</b>
          </h1>
          <div id="profile-copy" class="profile-copy"></div>
        </div>

        <footer class="site-footer">
          <div id="footer-copyright" class="footer-copyright"></div>
          <div id="footer-socials" class="footer-socials"></div>
        </footer>
        <canvas id="bg-canvas" class="bg-canvas" aria-hidden="true"></canvas>
      </main>
    </div>

    <!-- Order matters: data first, then features -->
    <script src="data/content.js"></script>
    <script src="scripts/render-content.js"></script>
    <script src="scripts/particles.js"></script>
    <script src="scripts/footer.js"></script>
    <script src="scripts/animated-name.js"></script>
    <script src="scripts/theme-chooser.js"></script>
    <script src="scripts/fit-screen.js"></script>
  </body>
</html>
